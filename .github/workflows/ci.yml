name: CI

# The repository has no other automation: `lib/` is committed and the skin
# market installs straight from it, so nothing catches a source change that was
# never rebuilt, or a test that quietly rotted. This job is the minimum that
# does.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: node build.mjs

      - name: Verify the committed bundle matches the sources
        run: |
          if git diff --quiet -- lib/; then
            exit 0
          fi
          echo '::error::lib/ is out of date with src/ — the skin market installs the committed bundle, so a source change without a rebuild ships stale code. Run `node build.mjs` and commit the result.'
          git diff --stat -- lib/
          echo '--- first byte difference per artifact ---'
          for f in lib/index.js lib/index.js.map lib/client.js lib/client.js.map; do
            git show "HEAD:$f" > /tmp/committed 2>/dev/null || continue
            cmp -s /tmp/committed "$f" && continue
            off=$(cmp /tmp/committed "$f" 2>&1 | grep -oE '[0-9]+' | head -1)
            echo "### $f differs near byte ${off:-unknown}"
            if [ -n "$off" ]; then
              start=$((off > 150 ? off - 150 : 0))
              echo "  committed: $(dd if=/tmp/committed bs=1 skip=$start count=300 2>/dev/null | tr -d '\n')"
              echo "  generated: $(dd if="$f" bs=1 skip=$start count=300 2>/dev/null | tr -d '\n')"
            fi
          done
          if ! cmp -s <(git show HEAD:lib/client.js.map) lib/client.js.map; then
            git show HEAD:lib/client.js.map > /tmp/committed.map
            node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('/tmp/committed.map','utf8'));const b=JSON.parse(fs.readFileSync('lib/client.js.map','utf8'));console.log('sources equal       :',JSON.stringify(a.sources)===JSON.stringify(b.sources));console.log('sourcesContent equal:',JSON.stringify(a.sourcesContent)===JSON.stringify(b.sourcesContent));console.log('mappings equal      :',a.mappings===b.mappings);console.log('names equal         :',JSON.stringify(a.names)===JSON.stringify(b.names));console.log('committed sources:',a.sources.join(' | '));console.log('generated sources:',b.sources.join(' | '));"
          fi
          exit 1

      - name: Unit tests
        run: node --test tests/*.test.mjs

      - name: Verify the package still carries its bundle patch
        run: |
          npm pack --dry-run --no-audit --no-fund 2>&1 | tee /tmp/pack.txt
          grep -q 'cordis.patch.yml' /tmp/pack.txt || {
            echo '::error::cordis.patch.yml is not in the npm pack output.'
            echo 'A package-manager install would fail at boot with'
            echo '"bundle patch is missing". Check the "files" whitelist.'
            exit 1
          }
